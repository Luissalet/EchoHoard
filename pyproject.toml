[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-hoard"
version = "0.1.0"
description = "Everything the user copies, kept on their own PC, searchable, with the things they copy often pinned, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "Pillow>=10",
  "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
echo-hoard = "echo.__main__:main"

[tool.setuptools.packages.find]
include = ["echo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
